name: kpi-labs

services:
  mongo:
    image: mongo:8
    container_name: kpi-labs-mongo
    ports:
      - 127.0.0.1:${MONGO_PORT:-27018}:27017
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongo-data:
    name: kpi-labs-mongo-data
